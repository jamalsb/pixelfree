<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Background Remover</title>
<meta name="description" content="Remove image background free, right in your browser. Your images never leave your device.">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6fb; color: #1f2937; }
  header { text-align: center; padding: 24px 16px 8px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .sub { margin: 6px 0 0; color: #6b7280; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
  .drop { display: block; border: 2px dashed #93c5fd; border-radius: 14px; padding: 32px 16px; text-align: center; cursor: pointer; }
  .drop.over { background: #eff6ff; }
  #file { display: none; }
  .btn { background: #2563eb; color: #fff; border: 0; padding: 12px 20px; border-radius: 10px; font-size: 1rem; cursor: pointer; }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn.secondary { background: #10b981; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  @media (max-width: 600px) { .previews { grid-template-columns: 1fr; } }
  .box { background: repeating-conic-gradient(#e5e7eb 0% 25%, #fff 0% 50%) 50% / 20px 20px; border-radius: 12px; min-height: 180px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .box img { max-width: 100%; max-height: 420px; display: block; }
  #status { text-align: center; margin-top: 14px; color: #4b5563; min-height: 1.2em; }
  .progress { height: 8px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-top: 8px; display: none; }
  .progress > div { height: 100%; width: 0; background: #2563eb; transition: width .2s; }
  footer { text-align: center; color: #9ca3af; font-size: .85rem; padding: 24px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>🖼️ Free Background Remover</h1>
  <p class="sub">Choose a picture and the background is removed automatically. Your image never leaves your device.</p>
</header>

<main>
  <div class="card">
    <label class="drop" id="drop">
      <div>📁 Drop an image here or click to choose one</div>
      <input type="file" id="file" accept="image/*">
    </label>

    <div class="progress" id="progress"><div id="bar"></div></div>
    <div id="status"></div>

    <div class="previews">
      <div><div class="box"><img id="orig" alt=""></div></div>
      <div><div class="box"><img id="result" alt=""></div></div>
    </div>

    <div class="row">
      <button class="btn" id="removeBtn" disabled>Remove Background</button>
      <button class="btn secondary" id="downloadBtn" disabled>Download (PNG)</button>
    </div>
  </div>
</main>

<footer>
  © <span id="year"></span> · <a href="#">Privacy Policy</a> · <a href="#">Contact</a>
</footer>

<script type="module">
import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/index.mjs';

const $ = id => document.getElementById(id);
let currentFile = null;
let origUrl = null;
let resultBlob = null;
let busy = false;

const MAX_SIDE = 1200; // large photos can freeze phones, so shrink first

$('year').textContent = new Date().getFullYear();

function setStatus(text) { $('status').textContent = text; }
function setProgress(percent) {
  $('progress').style.display = percent == null ? 'none' : 'block';
  if (percent != null) $('bar').style.width = percent + '%';
}

// Shrink the image to MAX_SIDE and return a PNG blob
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('Could not read this image.')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not open this image.')); };
    img.src = url;
  });
}

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('Please choose an image file only.');
    return;
  }
  currentFile = file;
  if (origUrl) URL.revokeObjectURL(origUrl);
  origUrl = URL.createObjectURL(file);
  $('orig').src = origUrl;
  $('result').removeAttribute('src');
  resultBlob = null;
  $('removeBtn').disabled = false;
  $('downloadBtn').disabled = true;
  setStatus('Now press "Remove Background".');
}

// File input and drag-and-drop
const drop = $('drop');
$('file').addEventListener('change', e => loadFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

// Remove background
$('removeBtn').addEventListener('click', async () => {
  if (!currentFile || busy) return;
  busy = true;
  $('removeBtn').disabled = true;
  try {
    setStatus('Preparing image...');
    setProgress(0);
    const small = await shrinkImage(currentFile);

    setStatus('Removing background (first time downloads the AI model, please wait)...');
    const blob = await removeBackground(small, {
      progress: (key, current, total) => {
        if (total) setProgress(Math.round(current / total * 100));
      }
    });

    resultBlob = blob;
    $('result').src = URL.createObjectURL(blob);
    $('downloadBtn').disabled = false;
    setStatus('Done ✅');
  } catch (err) {
    console.error(err);
    setStatus('Something went wrong: ' + (err && err.message ? err.message : err));
  } finally {
    setProgress(null);
    busy = false;
    $('removeBtn').disabled = false;
  }
});

// Download as PNG (transparent background)
$('downloadBtn').addEventListener('click', () => {
  if (!resultBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(resultBlob);
  a.download = 'no-background.png';
  a.click();
});
</script>
</body>
 </html>
